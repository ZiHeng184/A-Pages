<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📂宝藏网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFFFF;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .file-browser {
            width: 100%;
            max-width: 480px;
            background: transparent;
            padding: 0.5rem 0.75rem;
        }

        .title-section {
            margin-bottom: 0.25rem;
        }

        .title-text {
            font-size: 1.4rem;
            font-weight: 500;
            color: #111;
            letter-spacing: 0.5px;
            line-height: 1.4;
            margin-bottom: 0.25rem;
            padding-left: 0.25rem;
        }

        .divider {
            border: none;
            border-top: 2px solid #222;
            margin: 0 0 1rem 0;
            width: 100%;
            opacity: 0.85;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .file-item {
            display: block;
            text-decoration: none;
            color: #1a1a1a;
            font-size: 1.1rem;
            font-weight: 400;
            padding: 0.45rem 0.5rem;
            background: transparent;
            transition: background 0.1s ease;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            cursor: pointer;
        }

        .file-item:hover {
            background-color: rgba(0, 0, 0, 0.03);
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:visited {
            color: #1a1a1a;
        }

        .file-item.folder {
            font-weight: 500;
        }

        .file-item span {
            display: block;
            line-height: 1.4;
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem;
                justify-content: flex-start;
                padding-top: 3rem;
            }
            .title-text {
                font-size: 1.3rem;
            }
            .file-item {
                font-size: 1rem;
                padding: 0.4rem 0.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="file-browser">
        <div class="title-section">
            <div class="title-text">📂宝藏网站-点击打开</div>
            <hr class="divider">
        </div>

        <div class="file-list">
            <a href="https://tools.pdf24.org/zh/" class="file-item" target="_blank" rel="noopener noreferrer">
                <span>PDF24 Tools</span>
            </a>
            <a href="https://poki.com/zh" class="file-item" target="_blank" rel="noopener noreferrer">
                <span>Poki</span>
            </a>
              <a href="https://eaglercraft.ir/zh/" class="file-item" target="_blank" rel="noopener noreferrer">
                <span>在浏览器里玩 MC！</span>
            </a>
            </a>
              <a href="https://white-noise-generator.org/zh/whitenoisegenerator" class="file-item" target="_blank" rel="noopener noreferrer">
                <span>白噪音</span>
            </a>
            <a href="index.html" class="file-item folder">
                <span>← 返回上一级</span>
            </a>
        </div>
    </div>
</body>
</html>
