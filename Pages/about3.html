<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简介</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFFFF;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .file-browser {
            width: 100%;
            max-width: 480px;
            background: transparent;
            padding: 0.5rem 0.75rem;
        }

        .title-section {
            margin-bottom: 0.25rem;
        }

        .title-text {
            font-size: 1.4rem;
            font-weight: 500;
            color: #111;
            letter-spacing: 0.5px;
            line-height: 1.4;
            margin-bottom: 0.25rem;
            padding-left: 0.25rem;
        }

        .divider {
            border: none;
            border-top: 2px solid #222;
            margin: 0 0 1rem 0;
            width: 100%;
            opacity: 0.85;
        }

        /* 简介正文：不可点击，和文件项视觉区分 */
        .intro-text {
            font-size: 1.05rem;
            color: #1a1a1a;
            line-height: 1.7;
            padding: 0.25rem 0.5rem;
        }

        .intro-text p {
            margin-bottom: 0.8rem;
        }

        /* 下载按钮：简陋描边风格，和整体一致 */
        .download-btn {
            display: inline-block;
            text-decoration: none;
            color: #1a1a1a;
            font-size: 1.05rem;
            font-weight: 500;
            padding: 0.5rem 1.1rem;
            margin: 0.4rem 0.5rem 0.9rem 0.5rem;
            border: 1.5px solid #222;
            background: transparent;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .download-btn:hover {
            background-color: #222;
            color: #fff;
        }

        .download-btn:visited {
            color: #1a1a1a;
        }

        .download-btn:hover:visited {
            color: #fff;
        }

        /* 文件 / 文件夹条目样式 */
        .file-item {
            display: block;
            text-decoration: none;
            color: #1a1a1a;
            font-size: 1.1rem;
            font-weight: 400;
            padding: 0.45rem 0.5rem;
            background: transparent;
            transition: background 0.1s ease;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            cursor: pointer;
        }

        .file-item:hover {
            background-color: rgba(0, 0, 0, 0.03);
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:visited {
            color: #1a1a1a;
        }

        .file-item.folder {
            font-weight: 500;
        }

        .file-item span {
            display: block;
            line-height: 1.4;
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem;
                justify-content: flex-start;
                padding-top: 3rem;
            }
            .title-text {
                font-size: 1.3rem;
            }
            .file-item {
                font-size: 1rem;
                padding: 0.4rem 0.25rem;
            }
            .intro-text {
                font-size: 0.98rem;
            }
            .download-btn {
                font-size: 1rem;
                padding: 0.45rem 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="file-browser">
        <div class="title-section">
            <div class="title-text">简介</div>
            <hr class="divider">
        </div>

        <!-- 正文内容，随便改 -->
        <div class="intro-text">
            <p>PolyMC简介</p>
            <p><h3>系统要求：MacOS10.15 以上（Intel Mac）<h3>这是国外开源MC启动器。可以从下面下载按钮下载！Mac Intel版本下载下来是压缩文件，需要解压缩（注：Github不是盗版网站）</p>
        </div>

        <!-- 下载按钮：href 换成官方下载页或云盘分享链接 -->
        <a href="https://github.com/PolyMC/PolyMC/releases/download/7.1/PolyMC-macOS-Legacy-7.1.tar.gz" class="download-btn" target="_blank" rel="noopener noreferrer">
            下载（Github）
        </a>
         <a href="https://gh-proxy.org/https://github.com/PolyMC/PolyMC/releases/download/7.1/PolyMC-macOS-Legacy-7.1.tar.gz" class="download-btn" target="_blank" rel="noopener noreferrer">
            下载（加速链接）
        </a>

        <!-- 返回主页 -->
        <a href="folder1.html" class="file-item folder">
            <span>← 返回上一级</span>
        </a>
    </div>
</body>
</html>
