<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>扫雷 Minesweeper</title>
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: #FFFFFF;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 12px;
    color: #2c3e50;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    max-width: 100%;
  }

  .title {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 8px;
    text-indent: 8px;
    color: #8a94a0;
  }

  /* ---------- 顶部面板 ---------- */
  .panel {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    background: #f7f8f9;
    border: 1px solid #e6e8ea;
    border-radius: 12px;
  }

  .lcd {
    font-family: ui-monospace, "SF Mono", Consolas, "Courier New", monospace;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    background: #fff;
    border: 1px solid #e6e8ea;
    border-radius: 7px;
    padding: 3px 10px;
    min-width: 64px;
    text-align: center;
    color: #e74c3c;
    user-select: none;
  }
  .lcd.timer { color: #2c3e50; }

  .face {
    width: 46px;
    height: 46px;
    padding: 0;
    font-size: 25px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border: 1px solid #e6e8ea;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .08s ease, background .15s ease;
  }
  .face:hover { background: #f0f2f4; }
  .face:active { transform: scale(.93); }

  /* ---------- 棋盘 ---------- */
  .board-wrap {
    max-width: 100%;
    overflow: auto;
    padding: 8px;
    background: #f7f8f9;
    border: 1px solid #e6e8ea;
    border-radius: 12px;
    -webkit-overflow-scrolling: touch;
  }

  .board {
    --size: 30px;
    display: grid;
    user-select: none;
    -webkit-user-select: none;
    border-radius: 6px;
    overflow: hidden;
    background: #e9ebed;
    touch-action: manipulation;
  }

  .cell {
    width: var(--size);
    height: var(--size);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--size) * 0.58);
    font-weight: 700;
    line-height: 1;
    color: #333;
    background: #e4e6e8;
    box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #c3c6c9;
    cursor: pointer;
    transition: background .08s ease;
  }

  .cell:hover:not(.revealed) { background: #eef0f2; }

  .cell.revealed {
    background: #fbfcfd;
    box-shadow: inset 0 0 0 1px #eceef0;
    cursor: default;
  }

  .cell.flag { font-size: calc(var(--size) * 0.58); }

  .cell.exploded { background: #ff6b6b !important; }
  .cell.wrong { background: #ffe3e3; }

  /* 数字配色 */
  .cell.n1 { color: #1976d2; }
  .cell.n2 { color: #2e7d32; }
  .cell.n3 { color: #d32f2f; }
  .cell.n4 { color: #7b1fa2; }
  .cell.n5 { color: #ef6c00; }
  .cell.n6 { color: #0097a7; }
  .cell.n7 { color: #424242; }
  .cell.n8 { color: #9e9e9e; }

  /* ---------- 难度 ---------- */
  .levels {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .levels button {
    padding: 8px 15px;
    font-size: 13px;
    font-family: inherit;
    color: #5a6472;
    background: #fff;
    border: 1px solid #e6e8ea;
    border-radius: 9px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .levels button:hover { background: #f3f5f7; }
  .levels button.active {
    background: #2c3e50;
    border-color: #2c3e50;
    color: #fff;
  }

  .hint {
    font-size: 12px;
    color: #a4adb8;
    text-align: center;
    line-height: 1.7;
    margin: 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1 class="title">扫雷</h1>

  <div class="panel">
    <div class="lcd" id="mineCount">010</div>
    <button class="face" id="face" title="重新开始">🙂</button>
    <div class="lcd timer" id="timer">000</div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="levels">
    <button data-level="easy" class="active">初级 9×9</button>
    <button data-level="medium">中级 16×16</button>
    <button data-level="hard">高级 16×30</button>
  </div>

  <p class="hint">
    左键翻开 · 右键插旗 · 双击数字快速展开<br>
    手机：轻点翻开 · 长按插旗
  </p>
</div>

<script>
(function () {
  'use strict';

  /* ===================== 配置 ===================== */
  const LEVELS = {
    easy:   { rows: 9,  cols: 9,  mines: 10 },
    medium: { rows: 16, cols: 16, mines: 40 },
    hard:   { rows: 16, cols: 30, mines: 99 }
  };

  const boardEl  = document.getElementById('board');
  const faceEl   = document.getElementById('face');
  const mineEl   = document.getElementById('mineCount');
  const timerEl  = document.getElementById('timer');

  /* ===================== 状态 ===================== */
  let rows = 9, cols = 9, mines = 10;
  let grid = [];                 // grid[r][c] = { mine, revealed, flagged, adj, el }
  let revealedCount = 0;
  let flagCount = 0;
  let gameState = 'ready';       // ready | playing | won | lost
  let timerId = null;
  let seconds = 0;
  let currentLevel = 'easy';

  /* ===================== 工具 ===================== */
  function pad3(n) {
    if (n < 0) n = 0;
    if (n > 999) n = 999;
    return String(n).padStart(3, '0');
  }

  function updateMineDisplay() {
    mineEl.textContent = pad3(mines - flagCount);
  }

  function updateTimer() {
    timerEl.textContent = pad3(seconds);
  }

  function forEachNeighbor(r, c, fn) {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) fn(nr, nc);
      }
    }
  }

  /* ===================== 尺寸自适应 ===================== */
  function calcCellSize() {
    const availW = Math.min(window.innerWidth - 44, 920);
    const availH = window.innerHeight - 300;
    let s = Math.floor(Math.min(availW / cols, availH / rows));
    if (!isFinite(s) || s < 1) s = 22;
    return Math.max(22, Math.min(36, s));
  }

  function applySize() {
    const s = calcCellSize();
    boardEl.style.setProperty('--size', s + 'px');
    boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', ' + s + 'px)';
    boardEl.style.gridAutoRows = s + 'px';
  }

  /* ===================== 新游戏 ===================== */
  function newGame(level) {
    if (level) currentLevel = level;
    const cfg = LEVELS[currentLevel];
    rows = cfg.rows;
    cols = cfg.cols;
    mines = cfg.mines;

    clearInterval(timerId);
    timerId = null;
    seconds = 0;
    updateTimer();

    revealedCount = 0;
    flagCount = 0;
    updateMineDisplay();

    gameState = 'ready';
    faceEl.textContent = '🙂';

    grid = [];
    boardEl.innerHTML = '';
    applySize();

    const frag = document.createDocumentFragment();
    for (let r = 0; r < rows; r++) {
      const rowArr = [];
      for (let c = 0; c < cols; c++) {
        const el = document.createElement('div');
        el.className = 'cell';
        el.dataset.r = r;
        el.dataset.c = c;
        frag.appendChild(el);
        rowArr.push({ mine: false, revealed: false, flagged: false, adj: 0, el: el });
      }
      grid.push(rowArr);
    }
    boardEl.appendChild(frag);
  }

  /* ===================== 布雷（首点安全） ===================== */
  function placeMines(sr, sc) {
    const total = rows * cols;
    const safe = new Set();

    // 若能保证 3×3 安全区，则保护；否则只保护点击格本身
    const protectAll = (total - mines) >= 9;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (!protectAll && (dr !== 0 || dc !== 0)) continue;
        const r = sr + dr, c = sc + dc;
        if (r >= 0 && r < rows && c >= 0 && c < cols) safe.add(r * cols + c);
      }
    }

    const pool = [];
    for (let i = 0; i < total; i++) {
      if (!safe.has(i)) pool.push(i);
    }

    // Fisher–Yates 洗牌
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }

    for (let i = 0; i < mines && i < pool.length; i++) {
      const idx = pool[i];
      grid[Math.floor(idx / cols)][idx % cols].mine = true;
    }

    // 计算相邻雷数
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (grid[r][c].mine) continue;
        let n = 0;
        forEachNeighbor(r, c, function (nr, nc) {
          if (grid[nr][nc].mine) n++;
        });
        grid[r][c].adj = n;
      }
    }
  }

  /* ===================== 计时 ===================== */
  function startTimer() {
    if (timerId) return;
    timerId = setInterval(function () {
      seconds++;
      if (seconds >= 999) {
        seconds = 999;
        clearInterval(timerId);
        timerId = null;
      }
      updateTimer();
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerId);
    timerId = null;
  }

  /* ===================== 翻开 ===================== */
  function floodReveal(r, c) {
    const stack = [[r, c]];
    while (stack.length) {
      const cur = stack.pop();
      const cr = cur[0], cc = cur[1];
      const cell = grid[cr][cc];
      if (cell.revealed || cell.flagged || cell.mine) continue;

      cell.revealed = true;
      revealedCount++;
      cell.el.classList.add('revealed');

      if (cell.adj > 0) {
        cell.el.textContent = cell.adj;
        cell.el.classList.add('n' + cell.adj);
      } else {
        forEachNeighbor(cr, cc, function (nr, nc) {
          const nb = grid[nr][nc];
          if (!nb.revealed && !nb.flagged && !nb.mine) stack.push([nr, nc]);
        });
      }
    }
  }

  function handleReveal(r, c) {
    if (gameState === 'won' || gameState === 'lost') return;
    const cell = grid[r][c];
    if (cell.revealed || cell.flagged) return;

    if (gameState === 'ready') {
      placeMines(r, c);
      gameState = 'playing';
      startTimer();
    }

    if (cell.mine) {
      loseGame(r, c);
      return;
    }

    floodReveal(r, c);

    if (revealedCount === rows * cols - mines) {
      winGame();
    }
  }

  /* ===================== 插旗 ===================== */
  function toggleFlag(r, c) {
    if (gameState === 'won' || gameState === 'lost') return;
    const cell = grid[r][c];
    if (cell.revealed) return;

    cell.flagged = !cell.flagged;
    if (cell.flagged) {
      cell.el.textContent = '🚩';
      cell.el.classList.add('flag');
      flagCount++;
    } else {
      cell.el.textContent = '';
      cell.el.classList.remove('flag');
      flagCount--;
    }
    updateMineDisplay();
  }

  /* ===================== 快速展开（和弦） ===================== */
  function chord(r, c) {
    if (gameState !== 'playing') return;
    const cell = grid[r][c];
    if (!cell.revealed || cell.adj === 0) return;

    let flags = 0;
    forEachNeighbor(r, c, function (nr, nc) {
      if (grid[nr][nc].flagged) flags++;
    });
    if (flags !== cell.adj) return;

    forEachNeighbor(r, c, function (nr, nc) {
      const nb = grid[nr][nc];
      if (!nb.flagged && !nb.revealed) handleReveal(nr, nc);
    });
  }

  /* ===================== 胜负 ===================== */
  function loseGame(br, bc) {
    gameState = 'lost';
    stopTimer();
    faceEl.textContent = '😵';

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = grid[r][c];
        if (cell.mine) {
          if (!cell.flagged) {
            cell.el.classList.add('revealed');
            cell.el.textContent = '💣';
          }
        } else if (cell.flagged) {
          cell.el.classList.add('revealed', 'wrong');
          cell.el.textContent = '❌';
        }
      }
    }

    const hit = grid[br][bc];
    hit.el.classList.add('exploded');
    hit.el.textContent = '💥';
  }

  function winGame() {
    gameState = 'won';
    stopTimer();
    faceEl.textContent = '😎';

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = grid[r][c];
        if (cell.mine && !cell.flagged) {
          cell.flagged = true;
          cell.el.textContent = '🚩';
          cell.el.classList.add('flag');
          flagCount++;
        }
      }
    }
    updateMineDisplay();
  }

  /* ===================== 鼠标事件 ===================== */
  boardEl.addEventListener('contextmenu', function (e) {
    e.preventDefault();
  });

  boardEl.addEventListener('mousedown', function (e) {
    const el = e.target.closest('.cell');
    if (!el) return;
    const r = +el.dataset.r, c = +el.dataset.c;

    if (e.button === 2) {          // 右键：插旗
      e.preventDefault();
      toggleFlag(r, c);
    } else if (e.button === 1) {   // 中键：和弦
      e.preventDefault();
      chord(r, c);
    }
  });

  boardEl.addEventListener('click', function (e) {
    const el = e.target.closest('.cell');
    if (!el) return;
    const r = +el.dataset.r, c = +el.dataset.c;
    const cell = grid[r][c];
    if (cell.revealed) return;     // 已翻开交给双击处理
    handleReveal(r, c);
  });

  boardEl.addEventListener('dblclick', function (e) {
    const el = e.target.closest('.cell');
    if (!el) return;
    chord(+el.dataset.r, +el.dataset.c);
  });

  /* ===================== 触摸事件 ===================== */
  let touchTimer = null;
  let touchTarget = null;
  let longPressed = false;

  boardEl.addEventListener('touchstart', function (e) {
    if (gameState === 'won' || gameState === 'lost') return;
    const el = e.target.closest('.cell');
    if (!el) return;

    touchTarget = el;
    longPressed = false;
    clearTimeout(touchTimer);

    touchTimer = setTimeout(function () {
      longPressed = true;
      toggleFlag(+el.dataset.r, +el.dataset.c);
      if (navigator.vibrate) navigator.vibrate(25);
    }, 400);
  }, { passive: true });

  boardEl.addEventListener('touchend', function (e) {
    clearTimeout(touchTimer);
    if (touchTarget && !longPressed) {
      e.preventDefault();
      const r = +touchTarget.dataset.r;
      const c = +touchTarget.dataset.c;
      const cell = grid[r][c];
      if (cell.revealed) {
        chord(r, c);
      } else {
        handleReveal(r, c);
      }
    }
    touchTarget = null;
  });

  boardEl.addEventListener('touchmove', function () {
    clearTimeout(touchTimer);
    touchTarget = null;
  }, { passive: true });

  boardEl.addEventListener('touchcancel', function () {
    clearTimeout(touchTimer);
    touchTarget = null;
  });

  /* ===================== 控件 ===================== */
  faceEl.addEventListener('click', function () {
    newGame();
  });

  const levelBtns = document.querySelectorAll('.levels button');
  levelBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      levelBtns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      newGame(btn.dataset.level);
    });
  });

  window.addEventListener('resize', function () {
    applySize();
  });

  /* ===================== 启动 ===================== */
  newGame('easy');
})();
</script>
</body>
</html>
